# MARS Beacon — lo stack in piedi con un comando.
#
#     cd docker && cp mars.env.example .env && chmod 600 .env
#     docker compose up -d --build
#
# L'immagine e' lo STACK; MARS arriva dal montaggio di `..` su /app.
# Modificare un modulo ha effetto subito: non c'e' nulla da ricostruire
# finche' non cambiano requirements*.txt, package.json o le versioni di
# Python e Node.
#
# Il file .env sta accanto a questo ed e' gia' ignorato da git: la
# regola `.env` in .gitignore non ha una barra, quindi vale a ogni
# livello. Le chiavi non entrano mai in un layer dell'immagine.

services:
  mars:
    build:
      # Il contesto e' la radice: nell'immagine entrano solo i manifest
      # (requirements*.txt, package.json) e docker/entrypoint.sh.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # `on` aggiunge sentence-transformers e torch: alcuni GB.
        MARS_EMBEDDINGS: "off"
    image: mars-stack:latest
    command: ["api"]
    ports:
      - "${MARS_PORT_HOST:-8000}:8000"
    env_file:
      - .env
    environment:
      # Il nome del servizio, non 127.0.0.1: dentro la rete di compose
      # il daemon ZAP e' un altro host. Senza il profilo `zap` questo
      # indirizzo non risponde e l'area 8 ripiega sul controllo di
      # superficie, dichiarandolo (principio 2).
      ZAP_PROXY: "http://zap:8080"
    working_dir: /app
    volumes:
      # Il repository dell'host: e' QUESTO che gira, non una copia.
      - ..:/app
      # …tranne node_modules, che viene dall'immagine. Docker semina un
      # volume nominato vuoto con il contenuto che l'immagine ha in quel
      # percorso, e cosi' lo stack Node resta dello stack anche se
      # sull'host node_modules manca o e' di un'altra piattaforma.
      #
      # Serve per axe-core, che mars_wcag.py:27 cerca accanto ai moduli
      # e che NON ha un ripiego sul PATH. Lighthouse dal PATH ce l'ha, e
      # l'immagine glielo fornisce comunque.
      #
      # Dopo aver cambiato package.json il volume va rifatto, altrimenti
      # resta quello vecchio:
      #     docker compose down -v && docker compose up -d --build
      - mars_node_modules:/app/node_modules
    restart: unless-stopped

  # Profilo separato: `docker compose up` da solo non lo tira giu'.
  # L'immagine di ZAP e' grande e serve alla sola area 8, che senza
  # daemon non fallisce — ripiega e lo dichiara.
  #
  #     docker compose --profile zap up -d
  #
  # L'area 8 fa lo spider e l'active scan SOLO con
  # --i-own-this-domain / i_own_this_domain: lo spider di ZAP non
  # rispetta robots.txt (R55), quindi sta dietro la dichiarazione di
  # proprieta' come l'active scan. Senza dichiarazione ZAP vede le sole
  # pagine che il crawler di MARS ha gia' scaricato.
  zap:
    profiles: ["zap"]
    image: zaproxy/zap-stable
    user: zap
    # Il comando e' quello documentato in mars_wapt.py:28, piu' le due
    # `api.addrs`: ZAP accetta chiamate all'API dal solo localhost, e
    # qui arrivano da un altro container.
    command: >
      zap.sh -daemon
      -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  mars_node_modules:
