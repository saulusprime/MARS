<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima locale — M.A.R.S. Beacon nella pelle del sito</title>

<!--
  INVOLUCRO DI SOLA ANTEPRIMA. Non si pubblica: serve a guardare il
  frammento con i fogli di stile veri del sito prima di incollarlo nel
  CMS. Il file che si incolla e' `pagina-mars-beacon.html`, e questo qui
  lo carica invece di copiarlo: due copie divergerebbero, e la copia
  sbagliata sarebbe proprio quella che si guarda.

  I CSS arrivano dal sito in produzione, quindi serve la rete. Serve
  anche un server, perche' `fetch()` su `file://` e' vietato dal
  browser:

      python3 -m http.server -d landing 8080
      # poi http://127.0.0.1:8080/anteprima.html
-->
<link rel="stylesheet" href="https://www.lymphatechnologies.com/bs_italia/css/custom.min.css">
<link rel="stylesheet" href="https://www.lymphatechnologies.com/bs_italia/css/lympha.css">
<link rel="stylesheet" href="https://www.lymphatechnologies.com/lympha_tech/css/lympha-brand.css">
<link rel="stylesheet" href="https://www.lymphatechnologies.com/lympha_tech/css/custom.min.css">
<link rel="stylesheet" href="https://www.lymphatechnologies.com/css/fonts.min.css">
<style>
  .avviso-anteprima {
    background: #fff3cd; border-bottom: 1px solid #997404;
    padding: .6rem 1rem; font: 14px/1.5 system-ui, sans-serif; color: #593d00;
  }
  .avviso-anteprima code { background: #ffe69c; padding: .05rem .3rem; }
</style>
</head>
<body>

<p class="avviso-anteprima">
  <b>Anteprima locale.</b> Testata, piede e menu del sito non ci sono: qui
  c'è solo il frammento, con i fogli di stile veri caricati da
  <code>www.lymphatechnologies.com</code>. Il file da incollare nel CMS è
  <code>pagina-mars-beacon.html</code>.
</p>

<main id="main-container" tabindex="-1"></main>

<script>
/* Si carica il frammento invece di duplicarlo: e' l'unico modo perche'
 * l'anteprima non possa mentire su cio' che si pubblichera'.
 *
 * Gli <script> inseriti con innerHTML NON vengono eseguiti dal browser —
 * e' una regola di sicurezza, non un capriccio — quindi vanno ricreati a
 * mano. Senza, la pagina si vedrebbe ferma e sembrerebbe un difetto del
 * frammento. */
(function () {
  "use strict";
  var dove = document.getElementById("main-container");

  fetch("pagina-mars-beacon.html")
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.text();
    })
    .then(function (html) {
      dove.innerHTML = html;
      Array.prototype.forEach.call(dove.querySelectorAll("script"),
                                   function (vecchio) {
        var nuovo = document.createElement("script");
        nuovo.textContent = vecchio.textContent;
        vecchio.parentNode.replaceChild(nuovo, vecchio);
      });
    })
    .catch(function (e) {
      dove.innerHTML = "";
      var p = document.createElement("p");
      p.style.cssText = "padding:2rem;font:16px system-ui;color:#cc334d";
      p.textContent =
        "Non riesco a caricare pagina-mars-beacon.html (" + e.message +
        "). Su file:// il browser vieta fetch(): serve un server — " +
        "python3 -m http.server -d landing 8080";
      dove.appendChild(p);
    });
}());
</script>
</body>
</html>
